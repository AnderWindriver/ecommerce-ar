<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Iniciá sesión o creá tu cuenta en Probador AR."
    />
    <title>Mi cuenta | Probador AR</title>
    <link rel="stylesheet" href="/src/tienda.css" />

    <style>
      .cuenta-contenedor {
        width: min(92%, 440px);
        margin: 48px auto;
        padding: 28px;
        box-sizing: border-box;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      }

      .cuenta-contenedor h1,
      .cuenta-subtitulo {
        text-align: center;
      }

      .cuenta-pestanas {
        display: flex;
        gap: 10px;
        margin: 24px 0;
      }

      .cuenta-pestanas button,
      .cuenta-formulario button[type="submit"] {
        padding: 12px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
      }

      .cuenta-pestanas button {
        flex: 1;
        background: #eee;
      }

      .cuenta-pestanas button[aria-selected="true"] {
        background: #292929;
        color: white;
      }

      .cuenta-formulario {
        display: grid;
        gap: 14px;
      }

      .cuenta-formulario[hidden] {
        display: none;
      }

      .cuenta-formulario label {
        display: grid;
        gap: 6px;
      }

      .cuenta-formulario input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        padding-right: 42px; /* Espacio para el botón del ojo */
        border: 1px solid #ccc;
        border-radius: 8px;
        font: inherit;
      }

      /* Estilos para el contenedor del password y el botón del ojo */
      .input-password-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
      }

      .btn-toggle-password {
        position: absolute;
        right: 12px;
        background: transparent;
        border: none;
        cursor: pointer;
        color: #666;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px;
      }

      .btn-toggle-password:hover {
        color: #000;
      }

      .cuenta-formulario button[type="submit"] {
        margin-top: 6px;
        background: #292929;
        color: white;
      }

      .cuenta-formulario button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .cuenta-mensaje {
        padding: 12px;
        border-radius: 8px;
        overflow-wrap: anywhere;
        margin-bottom: 14px;
      }

      .cuenta-mensaje:empty {
        display: none;
      }

      .contenedor-olvide-pass {
        margin-top: 8px;
        text-align: right;
      }

      .contenedor-olvide-pass a,
      .cuenta-volver {
        color: #292929;
        font-size: 0.9rem;
        text-decoration: none;
      }

      .contenedor-olvide-pass a:hover,
      .cuenta-volver:hover {
        text-decoration: underline;
      }

      .cuenta-volver {
        display: block;
        margin-top: 24px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div id="app-header"></div>

    <main class="cuenta-contenedor">
      <h1>Mi cuenta</h1>
      <p class="cuenta-subtitulo">
        Iniciá sesión o creá tu cuenta para continuar.
      </p>

      <div
        class="cuenta-pestanas"
        role="tablist"
        aria-label="Opciones de cuenta"
      >
        <button
          type="button"
          id="pestana-login"
          role="tab"
          aria-selected="true"
          aria-controls="form-login"
        >
          Iniciar sesión
        </button>

        <button
          type="button"
          id="pestana-registro"
          role="tab"
          aria-selected="false"
          aria-controls="form-registro"
        >
          Crear cuenta
        </button>
      </div>

      <p
        id="cuenta-mensaje"
        class="cuenta-mensaje"
        role="status"
        aria-live="polite"
      ></p>

      <!-- FORMULARIO DE LOGIN -->
      <form id="form-login" class="cuenta-formulario" novalidate>
        <label for="login-email">
          Correo electrónico
          <input
            id="login-email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </label>

        <label for="login-password">
          Contraseña
          <div class="input-password-wrapper">
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
            <button type="button" id="btn-toggle-login-password" class="btn-toggle-password" aria-label="Mostrar contraseña">
              <svg class="icono-ojo" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </label>

        <div class="contenedor-olvide-pass">
          <a href="#" id="enlace-olvide-pass">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit">Iniciar sesión</button>
      </form>

      <!-- FORMULARIO DE REGISTRO -->
      <form id="form-registro" class="cuenta-formulario" hidden novalidate>
        <label for="registro-nombre">
          Nombre
          <input
            id="registro-nombre"
            name="nombre"
            type="text"
            autocomplete="name"
            maxlength="100"
            required
          />
        </label>

        <label for="registro-email">
          Correo electrónico
          <input
            id="registro-email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </label>

        <label for="registro-password">
          Contraseña
          <div class="input-password-wrapper">
            <input
              id="registro-password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
            <button type="button" id="btn-toggle-registro-password" class="btn-toggle-password" aria-label="Mostrar contraseña">
              <svg class="icono-ojo" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </label>

        <button type="submit">Crear cuenta</button>
      </form>

      <!-- FORMULARIO PARA ESTABLECER NUEVA CONTRASEÑA (Oculto por defecto) -->
      <form id="form-nueva-password" class="cuenta-formulario" hidden novalidate>
        <h2 style="font-size: 1.2rem; margin-top: 0; text-align: center;">Restablecer contraseña</h2>
        <p style="font-size: 0.85rem; color: #666; text-align: center; margin-bottom: 10px;">
          Ingresá tu nueva contraseña para continuar.
        </p>

        <label for="nueva-password">
          Nueva contraseña
          <div class="input-password-wrapper">
            <input
              id="nueva-password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
            <button type="button" id="btn-toggle-nueva-password" class="btn-toggle-password" aria-label="Mostrar contraseña">
              <svg class="icono-ojo" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </label>

        <button type="submit">Actualizar contraseña</button>
      </form>

      <a class="cuenta-volver" href="/">Volver a la tienda</a>
    </main>

    <script type="module" src="/src/header.js"></script>
    <script type="module" src="/js/login-vista.js"></script>
  </body>
</html>
