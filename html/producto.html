<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cargando producto...</title>
    <link rel="stylesheet" href="/src/tienda.css" />
  </head>
  <body>
    <div id="app-header"></div>

    <div class="detalle" id="detalle"></div>

    <footer>Probador AR · Demo educativa</footer>

    <!-- El molde invisible -->
    <template id="template-producto">
      <img class="detalle-img" id="imagen-prod" src="" alt="" />
      <div class="detalle-info">
        <h1 id="prod-nombre"></h1>
        <div class="detalle-precio" id="prod-precio"></div>
        <p class="detalle-desc" id="prod-desc"></p>

        <div class="selector-tonos">
          <span class="label">Tono</span>
          <span class="nombre-tono" id="nombre-tono"></span>
          <div class="lista-tonos" id="lista-tonos"></div>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 20px">
          <button
            class="btn-probar"
            id="btn-agregar"
            style="
              background: #fff;
              color: #000;
              border: 2px solid #000;
              flex: 1;
            "
          >
            AGREGAR AL CARRITO
          </button>
          <a
            class="btn-probar"
            id="btn-probar"
            style="flex: 1; text-align: center"
            >PROBAR EN AR</a
          >
        </div>
      </div>
    </template>

    <!-- Scripts al final -->
    <script type="module" src="/src/header.js"></script>
    <script type="module" src="/src/producto.js"></script>
    <script type="module" src="/src/ui-carrito.js"></script>
  </body>
</html>
